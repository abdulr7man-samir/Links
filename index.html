  <style>
    :root {
      --bg1:#070d1e; --bg2:#030712;
      --text:#ffffff; --muted:#94a3b8;
      --card:rgba(15, 23, 42, 0.6); 
      --card-border:rgba(255, 255, 255, 0.08);
      --accent:#38bdf8;
      --shadow:0 10px 30px rgba(0, 0, 0, 0.4);
    }
    [data-theme="light"] {
      --bg1:#f0f4f9; --bg2:#d9e2ec;
      --text:#1a202c; --muted:#4a5568;
      --card:rgba(255, 255, 255, 0.7); 
      --card-border:rgba(255, 255, 255, 0.8);
      --accent:#0077ff;
      --shadow:0 10px 25px rgba(0, 0, 0, 0.08);
    }
    *{box-sizing:border-box}
    body {
      margin:0; font-family:'Cairo', sans-serif;
      background:radial-gradient(circle at top, var(--bg1), var(--bg2));
      color:var(--text); text-align:center;
      display:flex; flex-direction:column;
      min-height:100vh; justify-content:center;
      padding:20px; overflow-x:hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }
    h1{margin: 0 0 4px; font-size:2.2rem; font-weight:700;}
    .sub{font-size:.95rem; color:var(--muted); font-weight:600;}
    p.bio{color:var(--text); min-height:24px; margin:12px 0 20px; font-weight:600;}
    
    .avatar-wrap{
      width:140px; height:140px; margin:0 auto 16px;
      border-radius:50%; padding:3px;
      background:linear-gradient(135deg,#38bdf8,#818cf8);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 25px rgba(56, 189, 248, 0.3);
      transition:transform .3s ease, box-shadow .3s ease;
    }
    .avatar-wrap:hover{
      transform:scale(1.05);
      box-shadow:0 0 35px rgba(56, 189, 248, 0.5);
    }
    .avatar{width:100%; height:100%; border-radius:50%; object-fit:cover;}
    
    ul{list-style:none; padding:0; max-width:400px; margin:20px auto; width:100%}
    li{margin:14px 0;}
    
    a.link-card{
      display:flex; 
      align-items:center; 
      justify-content:space-between;
      text-decoration:none; 
      font-weight:700;
      padding:16px 20px; 
      border-radius:30px;
      background:var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: all .25s ease;
      color: var(--text);
    }
    a.link-card svg{width:22px; height:22px; fill:currentColor;}
    a.link-card span{font-size: 1.05rem;}
    a.link-card:hover{
      transform:translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }
    
    .section-box {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      padding: 18px;
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .section-box h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .embed-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    footer{margin-top:20px; color:var(--muted); font-size:.85rem;}
    .controls{margin:10px 0; display:flex; gap:10px; justify-content:center}
    button{
      padding:10px 16px; border:1px solid var(--card-border); border-radius:20px;
      background:var(--card); color:var(--text); font-weight:700; font-family:'Cairo', sans-serif;
      cursor:pointer; box-shadow:var(--shadow); transition:.25s;
      backdrop-filter: blur(10px);
    }
    button:hover{transform:scale(1.05); border-color: var(--accent);}
    #bgCanvas{position:fixed; inset:0; z-index:-1; pointer-events:none;}
  </style>
</head>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const bio = document.getElementById("bio");
    const text = "الي فات اتنسي والي جاي هندسة ♥️";
    let index = 0;

    function typeEffect() {
      if (index < text.length) {
        bio.textContent += text.charAt(index);
        index++;
        setTimeout(typeEffect, 90);
      }
    }
    typeEffect();

    const themeBtn = document.getElementById("themeBtn");
    function setTheme(t) {
      document.body.setAttribute("data-theme", t);
      localStorage.setItem("theme", t);
    }
    setTheme(localStorage.getItem("theme") || "dark");
    themeBtn.onclick = () => {
      setTheme(document.body.getAttribute("data-theme") === "light" ? "dark" : "light");
    };

    document.getElementById("shareBtn").onclick = () => {
      const url = location.href;
      if (navigator.share) navigator.share({ title: document.title, url });
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => alert("تم نسخ الرابط!"));
    };

    const canvas = document.getElementById("bgCanvas"), ctx = canvas.getContext("2d");
    let w, h, parts = [];
    function size() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
    function init() {
      parts = [];
      for (let i = 0; i < 50; i++) {
        parts.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5, r: Math.random() * 2 + 0.5 });
      }
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      for (const p of parts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    size(); init(); draw();
    addEventListener("resize", () => { size(); init(); });
  </script>
